name: shaqti
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  flutter_bloc: ^9.1.1
  cloud_firestore: ^6.10.0
  go_router: ^17.5.0
  skeletonizer: ^3.0.0
  pro_dialog: ^1.0.9
  lucide_icons_flutter: ^4.0.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  icons_launcher: ^3.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"


flutter:

  uses-material-design: true

  assets:
  - assets/food.svg
  - assets/clean.svg
  - assets/need.svg
  - assets/rules.svg
  - assets/water.svg
  - assets/garbage.svg
  - assets/empty.svg
  - assets/google_logo.png
  - assets/login/


